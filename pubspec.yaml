name: vasatyl
description: "Vasatyl — One Big World. Let's Get You Connected."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: false
  image_path: "assets/images/icon/app_icon.png"
  adaptive_icon_background: "#0F8A5F"
  adaptive_icon_foreground: "assets/images/icon/app_icon_foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/vasatyl_logo.png
    - assets/images/parm_logo.png
